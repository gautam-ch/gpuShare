[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-share"
version = "0.1.0"
description = "Kinetic GPU Cluster Backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "psycopg2-binary",
    "requests",
    "httpx",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt",
    "python-dotenv",
]

[tool.setuptools]
packages = ["backend"]
py-modules = ["main"]

[tool.fastapi]
entrypoint = "backend.main:app"
